<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MentorLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --green: #1B5E20;
  --green-light: #4CAF50;
  --green-glow: rgba(76, 175, 80, 0.15);
  --green-subtle: #E8F5E9;
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-light: #9e9e9e;
  --border: #e8e8e8;
  --user-bubble: #1a1a1a;
  --assistant-bg: #f5f4f0;
  --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

/* ===== SCREENS ===== */
.screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
.screen.active { display: flex; }

/* ===== LOGIN ===== */
.login-screen { justify-content: center; align-items: center; padding: 32px; background: var(--bg); }
.login-card { width: 100%; max-width: 420px; text-align: center; }
.login-card .logo { font-family: 'Newsreader', serif; font-size: 44px; font-weight: 500; color: var(--green); margin-bottom: 2px; letter-spacing: -1px; }
.login-card .tagline { font-size: 15px; color: var(--text-secondary); margin-bottom: 40px; font-weight: 400; }
.form-box { background: var(--surface); border-radius: 20px; padding: 32px; border: 1px solid var(--border); text-align: left; }
.form-box .field-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: 0.3px; }
.form-box input, .form-box select, .form-box textarea {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px;
  font-size: 16px; font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg);
  margin-bottom: 16px; outline: none; transition: border-color 0.2s;
}
.form-box input:focus, .form-box textarea:focus, .form-box select:focus { border-color: var(--green-light); }
.form-box textarea { height: 70px; resize: none; }
.form-box .code-input { text-align: center; letter-spacing: 6px; font-size: 22px; font-weight: 600; text-transform: uppercase; }
.btn-primary { width: 100%; padding: 16px; background: var(--green); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; }
.btn-primary:hover { background: #2E7D32; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.4; transform: none; }
.error-msg { color: #D32F2F; font-size: 14px; margin-bottom: 12px; }
.step-info { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }

/* ===== DRAWER ===== */
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 80vw; background: var(--surface); z-index: 101; transform: translateX(-100%); transition: transform 0.25s ease; display: flex; flex-direction: column; }
.drawer-overlay.open .drawer { transform: translateX(0); }
.drawer-header { padding: 24px 20px 16px; display: flex; flex-direction: column; border-bottom: 1px solid var(--border); }
.drawer-header h2 { font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; }
.drawer-new-btn { background: var(--green); color: white; border: none; border-radius: 12px; padding: 14px 20px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; width: 100%; margin-top: 12px; transition: background 0.15s; }
.drawer-new-btn:hover { background: #2E7D32; }
.drawer-convs { flex: 1; overflow-y: auto; padding: 12px 16px; }
.drawer-conv { padding: 14px 16px; border-radius: 12px; margin-bottom: 6px; cursor: pointer; transition: background 0.15s; }
.drawer-conv:hover { background: var(--bg); }
.drawer-conv.active { background: var(--green-subtle); }
.drawer-conv-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-conv-meta { font-size: 12px; color: var(--text-light); }
.drawer-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.drawer-footer .logout-btn { font-size: 13px; color: var(--text-light); background: none; border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; width: 100%; }
.menu-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); padding: 4px; }

/* ===== CHAT ===== */
.chat-header { padding: 16px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
.chat-back { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); padding: 4px; }
.chat-header-info h2 { font-size: 17px; font-weight: 600; }
.chat-header-info .week-tag { font-size: 11px; color: var(--green); font-weight: 600; }

.messages { flex: 1; overflow-y: auto; padding: 24px 20px; }
.msg-row { margin-bottom: 20px; }
.msg-row.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg-row.assistant { display: flex; flex-direction: column; align-items: flex-start; }
.msg-content { max-width: 82%; padding: 14px 18px; border-radius: 20px; font-size: 17px; line-height: 1.6; }
.msg-row.user .msg-content { background: var(--user-bubble); color: white; border-bottom-right-radius: 6px; }
.msg-row.assistant .msg-content { background: var(--assistant-bg); color: var(--text); border-bottom-left-radius: 6px; font-family: 'Newsreader', serif; font-size: 18px; }
.msg-timestamp { font-size: 11px; color: var(--text-light); margin-top: 4px; padding: 0 4px; }
.thinking { color: var(--text-secondary); font-size: 15px; padding: 14px 18px; font-style: italic; }

/* ===== CHAT INPUT — VOICE FIRST ===== */
.input-area { padding: 16px 20px 28px; background: var(--surface); border-top: 1px solid var(--border); }

/* Voice mode (default) */
.voice-container { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.voice-btn {
  width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, #2E7D32, #43A047);
  box-shadow: 0 4px 24px rgba(27,94,32,0.3);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; position: relative;
  animation: idle-glow 3s ease-in-out infinite;
}
.voice-btn:hover { transform: scale(1.06); }
.voice-btn:active { transform: scale(0.96); }
.voice-btn svg { width: 32px; height: 32px; fill: white; }
@keyframes idle-glow {
  0%, 100% { box-shadow: 0 4px 24px rgba(27,94,32,0.3), 0 0 0 0px rgba(76,175,80,0.12); }
  50% { box-shadow: 0 4px 24px rgba(27,94,32,0.3), 0 0 0 12px rgba(76,175,80,0.08); }
}
.voice-btn.recording {
  background: linear-gradient(135deg, #C62828, #E53935);
  animation: pulse-ring 1.2s ease-out infinite;
}
@keyframes pulse-ring {
  0% { box-shadow: 0 0 0 0 rgba(198,40,40,0.5); }
  70% { box-shadow: 0 0 0 20px rgba(198,40,40,0); }
  100% { box-shadow: 0 0 0 0 rgba(198,40,40,0); }
}
.voice-label { font-size: 18px; color: var(--text-secondary); font-weight: 600; }
.voice-label.voice-duration { font-size: 22px; font-weight: 700; color: #C62828; font-variant-numeric: tabular-nums; }
.mode-switch { font-size: 13px; color: var(--text-light); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: 'Inter', sans-serif; }

/* Text mode */
.text-container { display: flex; align-items: flex-end; gap: 10px; position: relative; padding-bottom: 28px; }
.text-container input {
  flex: 1; padding: 14px 18px; border: 1.5px solid var(--border); border-radius: 24px;
  font-size: 17px; font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg);
  outline: none;
}
.text-container input:focus { border-color: var(--green-light); }
.text-send { width: 46px; height: 46px; border-radius: 50%; background: var(--green); color: white; border: none; font-size: 20px; cursor: pointer; transition: all 0.15s; }
.text-send:disabled { opacity: 0.3; }
.text-send:hover:not(:disabled) { background: #2E7D32; }
.voice-toggle-link { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); font-size: 12px; }

/* Transcribing state */
.transcribing { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; color: var(--green); font-size: 14px; font-weight: 500; }
.transcribing .spinner { width: 24px; height: 24px; border: 3px solid var(--green-subtle); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Voice preview */
.voice-preview { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--green-subtle); border-radius: 12px; margin-bottom: 10px; font-size: 13px; color: var(--green); border: 1px solid rgba(76,175,80,0.2); }
.voice-preview .clear { color: #C62828; font-weight: 600; cursor: pointer; margin-left: auto; background: none; border: none; font-family: 'Inter', sans-serif; font-size: 13px; }

/* Responsive */
@media (max-width: 500px) {
  .msg-content { font-size: 16px; }
  .msg-row.assistant .msg-content { font-size: 17px; }
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="screen-login" class="screen login-screen active">
<div class="login-card">
  <div class="logo">MentorLab</div>
  <div class="tagline">Your AI business mentor</div>
  <div class="form-box">
    <!-- Step 1: Create account (minimal) -->
    <div id="step-account">
      <p class="step-info">Create your account to get started</p>
      <p class="field-label">Your Name</p>
      <input id="r-name" placeholder="Full name">
      <p class="field-label">Phone Number</p>
      <input id="r-phone" placeholder="+256..." type="tel">
      <div id="r-error" class="error-msg"></div>
      <button class="btn-primary" onclick="doRegister()">Continue</button>
    </div>
    <!-- Step 2: Onboarding survey (only once) -->
    <div id="step-survey" style="display:none">
      <p class="step-info">Tell us about your business</p>
      <p class="field-label">Venture Name</p>
      <input id="r-venture" placeholder="Your business name">
      <p class="field-label">About your venture</p>
      <textarea id="r-desc" placeholder="What does your business do?"></textarea>
      <p class="field-label">Industry</p>
      <select id="r-industry"><option value="">Select...</option><option>Agriculture</option><option>Retail</option><option>Services</option><option>Food & Beverage</option><option>Technology</option><option>Manufacturing</option><option>Other</option></select>
      <div id="s-error" class="error-msg"></div>
      <button class="btn-primary" onclick="doSurvey()">Start chatting</button>
    </div>
  </div>
</div>
</div>

<!-- ===== DRAWER ===== -->
<div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-header">
      <h2>Conversations</h2>
      <button class="drawer-new-btn" onclick="newConv()">+ New</button>
    </div>
    <div class="drawer-convs" id="drawer-convs"></div>
    <div class="drawer-footer">
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </div>
</div>

<!-- ===== CHAT ===== -->
<div id="screen-chat" class="screen">
<div class="chat-header">
  <button class="menu-btn" onclick="openDrawer()">☰</button>
  <div class="chat-header-info">
    <h2 id="chat-title">Conversation</h2>
    <span class="week-tag" id="chat-week"></span>
  </div>
</div>
<div class="messages" id="messages"></div>
<div class="input-area">
  <div id="voice-preview" class="voice-preview" style="display:none">
    <span>🎤 Voice transcript — edit before sending</span>
    <button class="clear" onclick="clearVoice()">Clear</button>
  </div>
  <div id="transcribing" class="transcribing" style="display:none">
    <div class="spinner"></div> Transcribing your voice...
  </div>
  <div id="input-voice" class="voice-container">
    <button class="voice-btn" id="voice-btn" onclick="toggleRecord()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <span class="voice-label" id="voice-label">Tap to speak</span>
    <button class="mode-switch" onclick="switchToText()">or type instead</button>
  </div>
  <div id="input-text" class="text-container" style="display:none">
    <input id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendText()">
    <button class="text-send" id="send-btn" onclick="sendText()">↑</button>
    <button class="mode-switch voice-toggle-link" onclick="switchToVoice()">use voice</button>
  </div>
</div>
</div>

<script>
const API = window.location.origin;
let token = localStorage.getItem('t');
let participant = JSON.parse(localStorage.getItem('p') || 'null');
let convId = null, invCode = 'HDBU38JZ';
let mediaRec = null, audioChunks = [], isRecording = false, recTimer = null, recSecs = 0;
let lastInputMethod = 'text';
const voiceSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

// Detect best audio format for this browser
function getAudioMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/wav'];
  for (const t of types) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}
const audioMimeType = getAudioMimeType();
const audioExtension = audioMimeType.includes('webm') ? 'webm' : audioMimeType.includes('mp4') ? 'm4a' : audioMimeType.includes('ogg') ? 'ogg' : 'wav';

// --- API ---
async function api(path, opts = {}) {
  const h = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) h['Authorization'] = `Bearer ${token}`;
  const r = await fetch(`${API}${path}`, { ...opts, headers: h });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'Error'); }
  return r.json();
}

// --- Init ---
(async function init() {
  if (token && participant) {
    try {
      // Verify token is still valid
      participant = await api('/api/v1/me');
      localStorage.setItem('p', JSON.stringify(participant));
      enterApp();
    } catch (e) {
      // Token expired or invalid — clear and show login
      localStorage.clear(); token = null; participant = null;
    }
  }
})();

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function saveAuth() {
  localStorage.setItem('t', token);
  localStorage.setItem('p', JSON.stringify(participant));
}

// --- Auth ---
async function doRegister() {
  const name = document.getElementById('r-name').value.trim();
  if (!name) { document.getElementById('r-error').textContent = 'Please enter your name.'; return; }
  try {
    const d = await api('/api/v1/auth/register', { method: 'POST', body: JSON.stringify({
      invite_code: invCode, name,
      phone_number: document.getElementById('r-phone').value.trim(),
      venture_name: '', venture_description: '', industry_vertical: '',
    })});
    token = d.access_token; participant = d.participant;
    saveAuth();
    participant = await api('/api/v1/me/consent', { method: 'POST', body: JSON.stringify({ study_consent: true }) });
    saveAuth();
    // Show survey step for first-time users
    document.getElementById('step-account').style.display = 'none';
    document.getElementById('step-survey').style.display = 'block';
  } catch (e) { document.getElementById('r-error').textContent = e.message; }
}

async function doSurvey() {
  try {
    participant = await api('/api/v1/me', { method: 'PATCH', body: JSON.stringify({
      venture_name: document.getElementById('r-venture').value.trim(),
      venture_description: document.getElementById('r-desc').value.trim(),
      industry_vertical: document.getElementById('r-industry').value,
    })});
    saveAuth();
    enterApp();
  } catch (e) {
    // If PATCH fails (fields not allowed), just enter app — survey data is nice-to-have
    console.warn('Survey save failed:', e.message);
    enterApp();
  }
}

function doLogout() { localStorage.clear(); token = null; participant = null; location.reload(); }

// --- Enter App (auto-open latest or new conversation) ---
async function enterApp() {
  show('screen-chat');
  document.getElementById('messages').innerHTML = '<div class="thinking">Loading...</div>';
  try {
    const d = await api('/api/v1/conversations');
    if (d.conversations.length) {
      const c = d.conversations[0]; // most recent
      openConv(c.id, c.title || 'Conversation', c.week_number || 1);
    } else {
      await newConv();
    }
  } catch (e) {
    document.getElementById('messages').innerHTML = `<div class="thinking">${e.message}</div>`;
  }
}

// --- Drawer ---
function openDrawer() {
  loadDrawerConvs();
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
}
async function loadDrawerConvs() {
  try {
    const d = await api('/api/v1/conversations');
    const el = document.getElementById('drawer-convs');
    if (!d.conversations.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-light);font-size:14px;">No conversations yet</div>'; return; }
    el.innerHTML = d.conversations.map(c => {
      const title = c.title || 'New conversation';
      const time = new Date(c.last_message?.created_at || c.created_at).toLocaleDateString();
      const active = c.id === convId ? ' active' : '';
      return `<div class="drawer-conv${active}" onclick="openConv('${c.id}','${(title).replace(/'/g,"\\'")}',${c.week_number||1}); closeDrawer();">
        <div class="drawer-conv-title">${title}</div>
        <div class="drawer-conv-meta">Week ${c.week_number||'?'} · ${time}</div>
      </div>`;
    }).join('');
  } catch (e) { console.error(e); }
}

// --- Conversations ---
async function newConv() {
  closeDrawer();
  try {
    const d = await api('/api/v1/conversations', { method: 'POST' });
    openConv(d.conversation.id, d.conversation.title || 'New conversation', d.conversation.week_number || 1);
    renderMsgs(d.messages);
  } catch (e) { alert(e.message); }
}

// --- Chat ---
function openConv(id, title, week) {
  convId = id;
  document.getElementById('chat-title').textContent = title;
  document.getElementById('chat-week').textContent = `Week ${week}`;
  show('screen-chat');
  document.getElementById('messages').innerHTML = '<div class="thinking">Loading...</div>';
  api(`/api/v1/conversations/${id}`).then(d => renderMsgs(d.messages)).catch(e => {
    document.getElementById('messages').innerHTML = `<div class="thinking">${e.message}</div>`;
  });
  setInputState(STATES.VOICE_IDLE);
}

function renderMsgs(msgs) {
  const el = document.getElementById('messages');
  el.innerHTML = msgs.map(m => {
    const cls = m.role === 'user' ? 'user' : 'assistant';
    const t = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `<div class="msg-row ${cls}"><div class="msg-content">${m.content}</div><div class="msg-timestamp">${t}</div></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}
function appendMsg(role, text) {
  const el = document.getElementById('messages');
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  el.innerHTML += `<div class="msg-row ${role}"><div class="msg-content">${text}</div><div class="msg-timestamp">${t}</div></div>`;
  el.scrollTop = el.scrollHeight;
}

// --- Input State Machine ---
const STATES = { VOICE_IDLE: 'voice_idle', RECORDING: 'recording', TRANSCRIBING: 'transcribing', TEXT_PREVIEW: 'text_preview', TEXT_TYPING: 'text_typing' };
let inputState = STATES.VOICE_IDLE;

function setInputState(state) {
  inputState = state;
  const els = {
    voice: document.getElementById('input-voice'),
    text: document.getElementById('input-text'),
    preview: document.getElementById('voice-preview'),
    transcribing: document.getElementById('transcribing'),
    voiceLabel: document.getElementById('voice-label'),
    voiceBtn: document.getElementById('voice-btn'),
    toggleLink: document.querySelector('.voice-toggle-link'),
  };
  // Hide everything first
  els.voice.style.display = 'none';
  els.text.style.display = 'none';
  els.preview.style.display = 'none';
  els.transcribing.style.display = 'none';
  els.voiceBtn.classList.remove('recording');
  els.voiceLabel.classList.remove('voice-duration');

  switch (state) {
    case STATES.VOICE_IDLE:
      els.voice.style.display = 'flex';
      els.voiceLabel.textContent = 'Tap to speak';
      break;
    case STATES.RECORDING:
      els.voice.style.display = 'flex';
      els.voiceBtn.classList.add('recording');
      els.voiceLabel.classList.add('voice-duration');
      els.voiceLabel.textContent = '0:00';
      break;
    case STATES.TRANSCRIBING:
      els.transcribing.style.display = 'flex';
      break;
    case STATES.TEXT_PREVIEW:
      els.preview.style.display = 'flex';
      els.text.style.display = 'flex';
      if (els.toggleLink) els.toggleLink.style.display = 'none';
      document.getElementById('chat-input').focus();
      break;
    case STATES.TEXT_TYPING:
      els.text.style.display = 'flex';
      if (els.toggleLink) els.toggleLink.style.display = '';
      document.getElementById('chat-input').focus();
      break;
  }
}

function switchToVoice() { setInputState(STATES.VOICE_IDLE); }
function switchToText() { setInputState(STATES.TEXT_TYPING); }
function clearVoice() {
  lastInputMethod = 'text';
  document.getElementById('chat-input').value = '';
  setInputState(STATES.VOICE_IDLE);
}

async function toggleRecord() {
  if (!voiceSupported) {
    alert('Voice input requires a secure connection (HTTPS). Please use text input instead.');
    setInputState(STATES.TEXT_TYPING);
    return;
  }
  if (isRecording) { stopRecord(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const recorderOpts = audioMimeType ? { mimeType: audioMimeType } : {};
    mediaRec = new MediaRecorder(stream, recorderOpts);
    audioChunks = [];
    mediaRec.ondataavailable = e => audioChunks.push(e.data);
    mediaRec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: audioMimeType || 'audio/webm' });
      transcribe(blob);
    };
    mediaRec.start();
    isRecording = true;
    recSecs = 0;
    setInputState(STATES.RECORDING);
    recTimer = setInterval(updateTimer, 1000);
  } catch (e) { alert('Microphone access needed for voice input.'); }
}
function stopRecord() {
  if (mediaRec && isRecording) { mediaRec.stop(); isRecording = false; }
  clearInterval(recTimer);
}
function updateTimer() {
  recSecs++;
  const m = Math.floor(recSecs / 60), s = recSecs % 60;
  document.getElementById('voice-label').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

async function transcribe(blob) {
  setInputState(STATES.TRANSCRIBING);
  try {
    const form = new FormData();
    form.append('audio', blob, `recording.${audioExtension}`);
    form.append('conversation_id', convId || '');
    const h = {}; if (token) h['Authorization'] = `Bearer ${token}`;
    const r = await fetch(`${API}/api/v1/voice/transcribe`, { method: 'POST', headers: h, body: form });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `Server error ${r.status}`);
    }
    const d = await r.json();
    if (d.transcript) {
      lastInputMethod = 'voice';
      document.getElementById('chat-input').value = d.transcript;
      setInputState(STATES.TEXT_PREVIEW);
    } else {
      alert('No speech detected. Please try again.');
      setInputState(STATES.VOICE_IDLE);
    }
  } catch (e) { alert('Transcription failed: ' + e.message); setInputState(STATES.VOICE_IDLE); }
}

// --- Send ---
async function sendText() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !convId) return;
  input.value = '';
  const methodForThisMsg = lastInputMethod;
  lastInputMethod = 'text';

  appendMsg('user', text);
  const el = document.getElementById('messages');
  el.innerHTML += '<div class="thinking" id="think">Thinking...</div>';
  el.scrollTop = el.scrollHeight;
  document.getElementById('send-btn').disabled = true;

  try {
    const d = await api(`/api/v1/conversations/${convId}/messages`, {
      method: 'POST', body: JSON.stringify({ content: text, input_method: methodForThisMsg, client_id: crypto.randomUUID() }),
    });
    document.getElementById('think')?.remove();
    appendMsg('assistant', d.assistant_message.content);
    // Update title in header if it was generated
    if (d.assistant_message) {
      api(`/api/v1/conversations/${convId}`).then(conv => {
        if (conv.conversation.title) document.getElementById('chat-title').textContent = conv.conversation.title;
      }).catch(() => {});
    }
  } catch (e) {
    const t = document.getElementById('think');
    if (t) t.textContent = 'Error: ' + e.message;
  }
  document.getElementById('send-btn').disabled = false;
  setInputState(STATES.VOICE_IDLE);
}
</script>
